name: Capturador Diario BOJA

on:
  schedule:
    # Se ejecuta todos los días a las 09:00 y a las 15:00 UTC
    - cron: '0 9,15 * * *'
  workflow_dispatch: # Permite lanzarlo manualmente desde la pestaña Actions

jobs:
  run-boja-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase resend feedparser

      - name: Ejecutar script de scraping y envío
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python main.py
