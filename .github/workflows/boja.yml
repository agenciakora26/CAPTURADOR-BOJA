name: Automatizador BOJA

permissions:
  contents: read

concurrency:
  group: automatizador-boja
  cancel-in-progress: false

jobs:
  verificar-boja:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Comprobar archivos
        run: |
          echo "Archivos del repositorio:"
          ls -la
          test -f capturador.js
          test -f capturador-boe.js
          test -f enviar-resumen.js
          test -f package.json

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Ejecutar resumen unificado BOJA y BOE
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TZ: Europe/Madrid
        run: |
          node enviar-resumen.js
