name: Automatizador BOJA

on:
  workflow_dispatch:
  schedule:
    # Se ejecuta cada 30 minutos entre las 6:00 y las 13:00 (hora UTC/servidor) de lunes a viernes
    - cron: "0,30 6-13 * * 1-5"

permissions:
  contents: read

concurrency:
  group: automatizador-boja
  cancel-in-progress: false

jobs:
  verificar-boja:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Comprobar archivos
        run: |
          echo "Archivos del repositorio:"
          ls -la
          test -f capturador.js
          test -f capturador-boe.js
          test -f package.json

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Ejecutar capturador BOJA y BOE
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TZ: Europe/Madrid
        run: |
          node capturador.js
          node capturador-boe.js
