name: Automatizador BOJA

on:
  schedule:
    # GitHub Actions usa UTC
    # 06:00-13:45 UTC = 08:00-15:45 (horario de verano en España)
    - cron: "0,15,30,45 6-13 * * 1-5"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capturador-boja
  cancel-in-progress: false

jobs:
  verificar-boja:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar capturador
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TZ: Europe/Madrid
        run: node capturador.js
