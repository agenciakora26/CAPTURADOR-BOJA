name: Capturador Diario BOJA

on:
  schedule:
    # Se ejecuta automáticamente de lunes a viernes a las 08:00 AM (Hora España)
    - cron: '0 6 * * 1-5'
  workflow_dispatch: # Permite probarlo manualmente cuando quieras

jobs:
  ejecutar-script:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar capturador
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python main.py
