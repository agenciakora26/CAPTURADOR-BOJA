name: Automatizador BOJA

on:
  workflow_dispatch:
  schedule:
      # Cada 9 minutos de 8:00 a 15:54 CEST (6:00 a 13:54 UTC), de lunes a domingo
      - cron: "*/9 6-13 * * *"
      # Cada 9 minutos de 16:00 a 16:27 CEST (14:00 a 14:27 UTC), de lunes a domingo
      - cron: "0-30/9 14 * * *"

permissions:
  contents: read

concurrency:
  group: automatizador-boja
  cancel-in-progress: false

jobs:
  verificar-boja:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Comprobar archivos
        run: |
          echo "Archivos del repositorio:"
          ls -la
          test -f capturador.js
          test -f capturador-boe.js
          test -f enviar-resumen.js
          test -f package.json

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Ejecutar resumen unificado BOJA y BOE
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TZ: Europe/Madrid
        run: |
          node enviar-resumen.js
