name: Importar empresas PLACSP

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: importar-empresas-placsp
  cancel-in-progress: false

jobs:
  importar-empresas:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Importar adjudicaciones PLACSP
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

          PLACSP_START_FEED: "https://contrataciondelsectorpublico.gob.es/sindicacion/sindicacion_643/licitacionesPerfilesContratanteCompleto3.atom"

          PLACSP_MAX_PAGES: "1"
          PLACSP_DELAY_MS: "750"
          TZ: Europe/Madrid

        run: |
          node importar-placsp.js
